[project]
name = "requirements-engineering-mcp"
version = "0.1.0"
description = "MCP server exposing the engenharia-de-requisitos skill content to any MCP-compatible client (Claude Desktop, Cursor, Cline, Continue, Zed, etc.)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "Gabriel Marques", email = "gabriel.intetsu.dev@gmail.com" }]
keywords = ["mcp", "requirements-engineering", "ifpb", "babok", "sommerville", "bdd", "agile", "scrum"]
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
requirements-engineering-mcp = "requirements_engineering_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requirements_engineering_mcp"]
